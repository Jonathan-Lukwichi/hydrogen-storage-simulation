# Render Blueprint — deploys this repo as a static site.
# https://render.com/docs/blueprint-spec
services:
  - type: web
    name: hydrohea
    runtime: static
    buildCommand: ""
    staticPublishPath: .
    pullRequestPreviewsEnabled: true
    headers:
      - path: /*
        name: Cache-Control
        value: public, max-age=0, must-revalidate
      - path: /*.css
        name: Cache-Control
        value: public, max-age=3600
    routes:
      - type: rewrite
        source: /
        destination: /index.html
