<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<title>HydroHEA — Multi-Physics SaaS for Hydrogen Storage Alloys</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0" />

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@400;500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">

<link rel="stylesheet" href="hydrohea-styles.css" />

<style>
  html, body, #root { height: 100%; }
  body { margin: 0; background: var(--bg-0); }

  /* Route switcher pill — only visible with ?dev=1 (kept as a preview switcher).
     Inside the app, the sidebar is the single source of navigation truth. */
  .hh-route-pill {
    position: fixed; top: 16px; right: 24px; z-index: 200;
    display: inline-flex; align-items: center; gap: 2px;
    padding: 4px; border-radius: 999px;
    background: rgba(10, 14, 28, 0.85);
    border: 1px solid var(--border-strong);
    backdrop-filter: blur(14px);
    box-shadow: 0 8px 30px rgba(0,0,0,0.4);
    font-family: var(--font-mono);
    max-width: calc(100vw - 48px);
    overflow-x: auto;
  }
  .hh-route-pill::-webkit-scrollbar { display: none; }
  .hh-route-pill button {
    appearance: none; border: 0; background: transparent;
    color: var(--ink-3); font-family: inherit;
    font-size: 11px; letter-spacing: 0.06em;
    padding: 7px 12px; border-radius: 999px; cursor: pointer;
    transition: color .15s ease, background .15s ease;
    white-space: nowrap;
  }
  .hh-route-pill button:hover { color: var(--ink); }
  .hh-route-pill button.active {
    color: var(--ink);
    background: var(--surface-2);
    box-shadow: inset 0 0 0 1px var(--border-strong);
  }
  .hh-route-pill .hh-pill-tag {
    padding: 4px 8px; color: var(--gold);
    font-size: 9px; letter-spacing: 0.12em;
  }

  /* App-screen containers. */
  .hh-screen { width: 100%; height: 100vh; overflow: hidden; }
  .hh-screen-scroll { width: 100%; min-height: 100vh; overflow-x: hidden; }
  .hh-screen-scroll > .hh-art { height: auto; overflow: visible; }

  /* Toast slide-in. */
  @keyframes hh-toast-in {
    from { transform: translateY(-8px); opacity: 0; }
    to   { transform: translateY(0);    opacity: 1; }
  }

  /* Running spinner. */
  .hh-spin { animation: hh-spin 0.9s linear infinite; display: inline-block; }

  /* Mobile-nav hamburger (≤ 700 px). */
  .hh-mobile-nav {
    display: none;
    position: fixed; top: 12px; left: 12px; z-index: 250;
    width: 36px; height: 36px; border-radius: 10px;
    background: rgba(10,14,28,0.9); border: 1px solid var(--border-strong);
    color: var(--ink); font-size: 16px; cursor: pointer;
    backdrop-filter: blur(14px);
  }
  @media (max-width: 700px) { .hh-mobile-nav { display: inline-flex; align-items: center; justify-content: center; } }
</style>

<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" crossorigin="anonymous"></script>

<!-- jsPDF for real client-side PDF report generation -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js" crossorigin="anonymous"></script>

<!-- Real physics module (analytic solutions: Fick erfc, Arrhenius, etc.) -->
<script src="hydrohea-physics.js"></script>

<!-- Ridge-regression surrogate trained on the physics module at startup -->
<script src="hydrohea-surrogate.js"></script>

<!-- Real PDF report builder (uses jsPDF) -->
<script src="hydrohea-pdf.js"></script>
</head>
<body>
<div id="root"></div>

<script type="text/babel" src="hydrohea-shell.jsx"></script>
<script type="text/babel" src="hydrohea-app.jsx"></script>
<script type="text/babel" src="hydrohea-landing-hero.jsx"></script>
<script type="text/babel" src="hydrohea-landing.jsx"></script>
<script type="text/babel" src="hydrohea-dashboard.jsx"></script>
<script type="text/babel" src="hydrohea-ai.jsx"></script>
<script type="text/babel" src="hydrohea-library.jsx"></script>
<script type="text/babel" src="hydrohea-validation.jsx"></script>

<script type="text/babel">
const { useState, useEffect } = React;

const ROUTES = [
  { id: 'landing',    label: 'Landing',    component: 'HHLanding' },
  { id: 'signin',     label: 'Sign in',    component: 'HHSignIn' },
  { id: 'overview',   label: 'Overview',   component: 'HHOverview' },
  { id: 'home',       label: 'Overview',   component: 'HHOverview', hidden: true },
  { id: 'setup',      label: 'Recipe Lab', component: 'HHRecipeLab' },
  { id: 'simulator',  label: 'Simulator',  component: 'HHDashboard' },
  { id: 'ai',         label: 'AI',         component: 'HHAIPredictor' },
  { id: 'library',    label: 'Library',    component: 'HHLibrary' },
  { id: 'validation', label: 'Validation', component: 'HHValidation' },
  { id: 'reports',    label: 'Reports',    component: 'HHReports' },
  { id: 'docs',       label: 'Docs',       component: 'HHDocs' },
  { id: 'settings',   label: 'Settings',   component: 'HHSettings' },
];

const ROUTE_MAP = Object.fromEntries(ROUTES.map(r => [r.id, r]));

function routeFromHash() {
  const h = (window.location.hash || '').replace('#', '');
  return ROUTE_MAP[h] ? h : 'landing';
}

const DEV_MODE = /[?&]dev=1\b/.test(window.location.search);

function App() {
  const [route, setRoute] = useState(routeFromHash);

  useEffect(() => {
    const onHash = () => { setRoute(routeFromHash()); window.scrollTo(0, 0); };
    window.addEventListener('hashchange', onHash);
    return () => window.removeEventListener('hashchange', onHash);
  }, []);

  const go = id => { window.location.hash = id; };

  const current = ROUTE_MAP[route] || ROUTE_MAP.landing;
  const Screen = window[current.component];

  // Surface a clear warning if a route resolves but its component never
  // attached to window (usually a runtime error in that file's <script>).
  React.useEffect(() => {
    if (!Screen) console.warn(`[HydroHEA] Route "${route}" expected window.${current.component} but it's undefined — falling back.`);
  }, [route, current.component]);

  const useScroll = route === 'landing';

  // The route pill is a preview/dev switcher. The sidebar is the real nav inside
  // the app — keep the pill OFF by default so it doesn't compete. Re-enable
  // with ?dev=1 in the URL when previewing all screens.
  const showPill = DEV_MODE;

  return (
    <window.HHProvider>
      {showPill && (
        <div className="hh-route-pill" role="tablist" aria-label="HydroHEA dev switcher">
          <span className="hh-pill-tag">DEV</span>
          {ROUTES.filter(r => !r.hidden).map(r => (
            <button
              key={r.id}
              type="button"
              role="tab"
              aria-selected={r.id === route}
              className={r.id === route ? 'active' : ''}
              onClick={() => go(r.id)}
            >{r.label.toUpperCase()}</button>
          ))}
        </div>
      )}

      <div className={useScroll ? 'hh-screen-scroll' : 'hh-screen'}>
        {Screen ? <Screen /> : (
          <div style={{ padding: 40, color: 'var(--ink-2)', fontFamily: 'Inter, sans-serif' }}>
            Loading {current.label}…
          </div>
        )}
      </div>
    </window.HHProvider>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
